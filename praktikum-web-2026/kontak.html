<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul 2 - Form kontak</title>
</head>

<body>

    <header>
        <h1 style="text-align: center;">Formulir Kontak</h1>
        <nav>
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="kontak.html">Hubungi Saya</a></li>
                <li><a href="resume.html">Tentang Saya</a></li>
                <li><a href="projek.html">Projek</a></li>
            </ul>
        </nav>
    </header>
    
    <header>
        <h1>Formulir Kontak</h1>
    </header>

    <hr>

    <main>
        <section>
            <h2>
                Kirimkan Pesan atau Penawaran Proyek Anda ☺️
            </h2>
            <form>
                <p>
                    <label for="nama_pengirim">Nama Lengkap Anda:</label>
                    <input type="text" id="nama_pengirim" name="nama_pengirim">
                </p>
                <p>
                    <label for="email_pengirim">Alamat Email:</label>
                    <input type="email" id="email_pengirim" name="email_pengirim">
                </p>

                <p>
                    <label for="jenis_layanan">Layanan Yang Dibutuhkan:</label><br>
                    <select id="jenis_layanan" name="jenis_layanan">
                        <option value="">-- Pilih Layanan --</option>
                        <option value="web">Pembuatan Web</option>
                        <option value="app">Pengembangan Aplikasi</option>
                    </select>
                </p>

                <p>
                    <label for="pesan">Pesan Sekarang ☺️:</label><br>
                    <textarea id="pesan" name="pesan" rows="15" cols="125"></textarea>
                </p>

                <p>
                    <button type="submit">Kirimkan Pesanan ☺️</button>
                    <button type="reset">Batal 😭</button>
                </p>
            </form>
        </section>
    </main>

    <hr>

    <footer>
        <p style="text-align: center;">&copy; 2026 Teknik Informatika ITG</p>
    </footer>
</body>
</html>
